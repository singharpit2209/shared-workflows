# Example: manual apply — plan and apply jobs both configure OIDC in the caller repo.

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      working_directory:
        default: core/dev/dns
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - uses: singharpit2209/shared-workflows/actions/terraform-plan@main
        with:
          working_directory: ${{ inputs.working_directory }}
          artifact_name: terraform-plan-dev-${{ github.run_id }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - uses: singharpit2209/shared-workflows/actions/terraform-apply@main
        with:
          working_directory: ${{ inputs.working_directory }}
          artifact_name: terraform-plan-dev-${{ github.run_id }}
