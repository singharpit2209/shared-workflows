# Example: manual apply with component + environment inputs (core-iac pattern).

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      component:
        default: kms
        type: choice
        options: [kms, vpc, dns, alarms]
      environment:
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - uses: singharpit2209/shared-workflows/actions/terraform-plan@main
        with:
          working_directory: tf/${{ inputs.component }}
          var_file: account/${{ inputs.environment }}/terraform.tfvars
          backend_config: account/${{ inputs.environment }}/backend.hcl
          artifact_name: terraform-plan-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - uses: singharpit2209/shared-workflows/actions/terraform-apply@main
        with:
          working_directory: tf/${{ inputs.component }}
          backend_config: account/${{ inputs.environment }}/backend.hcl
          artifact_name: terraform-plan-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}
