# Example: plan on pull request — OIDC runs in THIS repo's job (required for IAM trust).

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "core/dev/dns/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

  - uses: singharpit2209/shared-workflows/actions/terraform-plan@main
    with:
      working_directory: tf/kms
      var_file: account/dev/terraform.tfvars
      backend_config: account/dev/backend.hcl
      artifact_name: terraform-plan-dev-kms-${{ github.run_id }}
