# Example: manual destroy (blocked unless confirmation=destroy).
#
# Copy to core-iac/.github/workflows/terraform-destroy.yml.

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      working_directory:
        description: Terraform root module path
        required: true
        default: core/dev/dns
        type: string
      confirmation:
        description: Type "destroy" to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    uses: singharpit2209/shared-workflows/.github/workflows/terraform-destroy.yml@main
    with:
      working_directory: ${{ inputs.working_directory }}
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      environment: dev
      confirmation: ${{ inputs.confirmation }}
