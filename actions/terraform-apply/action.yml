name: Terraform Apply
description: Apply a saved Terraform plan (AWS creds must already be configured in the caller job).

inputs:
  working_directory:
    description: Path to the Terraform root module
    required: true
  artifact_name:
    description: Name of the uploaded plan artifact from the plan job
    required: true
  terraform_version:
    description: Terraform CLI version
    required: false
    default: 1.10.5
  backend_config:
    description: Optional backend config file (relative to working_directory)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Download plan artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: ${{ inputs.artifact_name }}

    - name: Terraform init
      shell: bash
      run: |
        set -euo pipefail
        args=(-input=false)
        if [ -n "${{ inputs.backend_config }}" ]; then
          args+=(-backend-config="${{ inputs.backend_config }}")
        fi
        terraform init "${args[@]}"
      working-directory: ${{ inputs.working_directory }}

    - name: Terraform apply saved plan
      shell: bash
      run: terraform apply -input=false -refresh=false -no-color tfplan
      working-directory: ${{ inputs.working_directory }}
