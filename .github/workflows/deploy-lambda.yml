name: Deploy Lambda

on:
  workflow_call:
    inputs:
      artifact_version:
        description: Immutable artifact version from build workflow
        required: true
        type: string
      artifact_name:
        description: Artifact file name (zip or jar)
        required: true
        type: string
      artifact_type:
        description: zip or jar
        required: true
        type: string
      build_artifact_name:
        description: GitHub Actions artifact name from build workflow
        required: true
        type: string
      app_name:
        description: Application name for naming contract (e.g. hello-world)
        required: false
        type: string
        default: ""
      component:
        description: Component key for naming contract (e.g. python)
        required: false
        type: string
        default: ""
      lambda_function_name:
        description: Optional override — computed from naming contract when empty
        required: false
        type: string
        default: ""
      artifact_bucket_name:
        description: Optional override — computed from naming contract when empty
        required: false
        type: string
        default: ""
      lambda_alias_name:
        description: Alias to update after publish
        required: false
        type: string
        default: "live"
      environment:
        description: Logical environment label
        required: false
        type: string
        default: "dev"
      aws_role_arn:
        description: IAM role ARN for OIDC (defaults to vars.AWS_ROLE_ARN)
        required: false
        type: string
        default: ""
      aws_region:
        description: AWS region
        required: false
        type: string
        default: "us-east-1"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: singharpit2209/shared-workflows/actions/validate-branch-environment@v0.4.0
        with:
          environment: ${{ inputs.environment }}

      - name: Validate AWS configuration
        shell: bash
        run: |
          set -euo pipefail
          ROLE_ARN="${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || vars.AWS_ROLE_ARN }}"
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS role ARN is not set. Add AWS_ROLE_ARN variable (app-cd-deployer)."
            exit 1
          fi

      - uses: singharpit2209/shared-workflows/actions/resolve-deployment-target@v0.4.0
        id: target
        with:
          app_name: ${{ inputs.app_name }}
          component: ${{ inputs.component }}
          environment: ${{ inputs.environment }}
          lambda_alias_name: ${{ inputs.lambda_alias_name }}
          aws_region: ${{ inputs.aws_region != '' && inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region != '' && inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
          role-session-name: gha-deploy-lambda

      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.build_artifact_name }}
          path: artifact

      - name: Upload to S3 and update Lambda
        shell: bash
        env:
          FN: ${{ inputs.lambda_function_name != '' && inputs.lambda_function_name || steps.target.outputs.lambda_function_name }}
          BUCKET: ${{ inputs.artifact_bucket_name != '' && inputs.artifact_bucket_name || steps.target.outputs.artifact_bucket_name }}
          ALIAS: ${{ inputs.lambda_alias_name != '' && inputs.lambda_alias_name || steps.target.outputs.lambda_alias_name }}
        run: |
          set -euo pipefail
          FILE="artifact/${{ inputs.artifact_name }}"
          if [ ! -f "$FILE" ]; then
            FILE=$(find artifact -name "${{ inputs.artifact_name }}" | head -1)
          fi
          if [ ! -f "$FILE" ]; then
            echo "::error::Artifact file not found: ${{ inputs.artifact_name }}"
            ls -la artifact/
            exit 1
          fi
          KEY="deployments/${FN}/${{ inputs.artifact_version }}/${{ inputs.artifact_name }}"
          aws s3 cp "$FILE" "s3://${BUCKET}/${KEY}"
          if [ "${{ inputs.artifact_type }}" = "jar" ]; then
            aws lambda update-function-code \
              --function-name "${FN}" \
              --s3-bucket "${BUCKET}" \
              --s3-key "${KEY}"
          else
            aws lambda update-function-code \
              --function-name "${FN}" \
              --zip-file "fileb://${FILE}"
          fi
          aws lambda wait function-updated --function-name "${FN}"
          VERSION=$(aws lambda publish-version --function-name "${FN}" --query Version --output text)
          aws lambda update-alias \
            --function-name "${FN}" \
            --name "${ALIAS}" \
            --function-version "${VERSION}" 2>/dev/null || \
          aws lambda create-alias \
            --function-name "${FN}" \
            --name "${ALIAS}" \
            --function-version "${VERSION}"
          echo "Deployed ${{ inputs.artifact_version }} to ${FN} as version ${VERSION}"
